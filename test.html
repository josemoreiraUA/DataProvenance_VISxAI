<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Contents</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            font-family: Arial, sans-serif;

            display: flex;
            gap: 40px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Left-hand contents */
        .menu {
            width: 28%;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .menu button {
            height: 130px;
            border: 3px solid #073b52;
            border-radius: 22px;
            background: #000;
            color: white;

            font-size: 24px;
            cursor: pointer;

            transition: background 0.2s, border-color 0.2s;
        }

        .menu button:hover {
            background: #073b52;
            border-color: #0b6688;
        }

        .menu button.active {
            background: #073b52;
            border-color: #0b6688;
        }

        /* Right-hand display area */
        .display {
            flex: 1;
            background: white;
            border: 3px solid #073b52;
            border-radius: 60px;

            padding: 50px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: auto;
        }

        /* SQL */
        .sql {
            width: 90%;
            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 12px;

            padding: 25px;
            box-sizing: border-box;

            font-family: Consolas, monospace;
            font-size: 18px;
            line-height: 1.5;

            white-space: pre-wrap;
            text-align: left;
        }

        /* Images */
        .display img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        /* Text */
        .description {
            max-width: 85%;
            font-size: 22px;
            line-height: 1.6;
            text-align: left;
        }
    </style>
</head>

<body>

    <!-- LEFT SIDE -->
    <div class="menu">

        <button onclick="showQuery(this)">
            Query
        </button>

        <button onclick="showAST(this)">
            Abstract Syntax Tree
        </button>

        <button onclick="showRelationalAlgebra(this)">
            Relational Algebra
        </button>

        <button onclick="showProvenance(this)">
            Provenance
        </button>

        <button onclick="showResult(this)">
            Result
        </button>

    </div>


    <!-- RIGHT SIDE -->
    <div id="display" class="display">
        <div class="description">
            Select an item on the left.
        </div>
    </div>


    <script>

        const display = document.getElementById("display");


        /*
         * Highlight the selected button
         */
        function activateButton(button) {

            document.querySelectorAll(".menu button")
                .forEach(btn => btn.classList.remove("active"));

            button.classList.add("active");
        }


        /*
         * QUERY
         */
        function showQuery(button) {

            activateButton(button);

            display.innerHTML = `
                <pre class="sql">SELECT
    e.empId,
    e.name,
    p.promotionDate
FROM employees e
JOIN promotions p
    ON e.empId = p.empId
WHERE p.status = 'Approved'
ORDER BY p.promotionDate;</pre>
            `;
        }


        /*
         * ABSTRACT SYNTAX TREE
         */
        function showAST(button) {

            activateButton(button);

            display.innerHTML = `
                <img
                    src="images/ast.png"
                    alt="Abstract Syntax Tree">
            `;
        }


        /*
         * RELATIONAL ALGEBRA
         */
        function showRelationalAlgebra(button) {

            activateButton(button);

            display.innerHTML = `
                <img
                    src="images/relational-algebra.png"
                    alt="Relational Algebra">
            `;
        }


        /*
         * PROVENANCE
         */
        function showProvenance(button) {

            activateButton(button);

            display.innerHTML = `
                <div class="description">

                    <h2>Data Provenance</h2>

                    <p>
                        The provenance expression records the input tuples
                        that contributed to the query result.
                    </p>

                    <p>
                        <strong>e101 ⊗ p23</strong>
                        &nbsp;+&nbsp;
                        <strong>e105 ⊗ p31</strong>
                    </p>

                </div>
            `;
        }


        /*
         * RESULT
         */
        function showResult(button) {

            activateButton(button);

            display.innerHTML = `
                <div class="description">

                    <h2>Query Result</h2>

                    <table border="1" cellpadding="10">
                        <tr>
                            <th>empId</th>
                            <th>Name</th>
                            <th>Promotion Date</th>
                        </tr>

                        <tr>
                            <td>emp-101</td>
                            <td>Alice Smith</td>
                            <td>2025-03-15</td>
                        </tr>

                        <tr>
                            <td>emp-105</td>
                            <td>Robert Jones</td>
                            <td>2025-06-21</td>
                        </tr>

                    </table>

                </div>
            `;
        }

    </script>

</body>
</html>
