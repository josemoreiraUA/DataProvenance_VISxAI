<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataProv AST</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        #tree {
            width: 100%;
            height: 850px;
        }

        .node rect {
            stroke-width: 1.5px;
            rx: 8;
            ry: 8;
        }

        .node text {
            font-size: 13px;
            pointer-events: none;
        }

        .node.operator rect {
            fill: #dbeafe;
            stroke: #2563eb;
        }

        .node.scan rect {
            fill: #dcfce7;
            stroke: #16a34a;
        }

        .node.expression rect {
            fill: #fef3c7;
            stroke: #d97706;
        }

        .node.provenance rect {
            fill: #f3e8ff;
            stroke: #9333ea;
        }

        .node.predicate rect {
            fill: #fee2e2;
            stroke: #dc2626;
        }

        .node text.title {
            font-weight: bold;
        }

        .link {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 1.5px;
        }

        .node circle {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="tree"></div>

<script>

const data = {
    name: "UNION ALL",
    type: "operator",
    children: [

        {
            name: "PROJECT",
            type: "operator",
            children: [

                {
                    name: "Expressions",
                    type: "expression",
                    children: [
                        {
                            name: "EA.name AS Employee",
                            type: "expression"
                        },
                        {
                            name: "T.name AS Action",
                            type: "expression"
                        },
                        {
                            name: "T.hours",
                            type: "expression"
                        },
                        {
                            name: "PROV_COMBINE",
                            type: "provenance",
                            children: [
                                {
                                    name: "EA.prov",
                                    type: "provenance"
                                },
                                {
                                    name: "T.prov",
                                    type: "provenance"
                                }
                            ]
                        }
                    ]
                },

                {
                    name: "SELECT",
                    type: "operator",
                    children: [

                        {
                            name: "Predicate: T.actionId = EA.actionId",
                            type: "predicate"
                        },

                        {
                            name: "CROSS PRODUCT",
                            type: "operator",
                            children: [

                                {
                                    name: "SCAN",
                                    type: "scan",
                                    children: [
                                        {
                                            name: "Training_actions.parquet AS T",
                                            type: "scan"
                                        }
                                    ]
                                },

                                {
                                    name: "SCAN",
                                    type: "scan",
                                    children: [
                                        {
                                            name: "Employees_training_actions.parquet AS EA",
                                            type: "scan"
                                        }
                                    ]
                                }
                            ]
                        }
                    ]
                }
            ]
        },

        {
            name: "PROJECT",
            type: "operator",
            children: [

                {
                    name: "Expressions",
                    type: "expression",
                    children: [
                        {
                            name: "ET.name",
                            type: "expression"
                        },
                        {
                            name: "ET.training_program",
                            type: "expression"
                        },
                        {
                            name: "ET.hours",
                            type: "expression"
                        },
                        {
                            name: "ET.prov",
                            type: "provenance"
                        }
                    ]
                },

                {
                    name: "SCAN",
                    type: "scan",
                    children: [
                        {
                            name: "Employees_training.parquet AS ET",
                            type: "scan"
                        }
                    ]
                }
            ]
        }
    ]
};


// ------------------------------------------------------------
// Configuration
// ------------------------------------------------------------

const container = document.getElementById("tree");

const width = container.clientWidth;
const height = 850;

const margin = {
    top: 50,
    right: 40,
    bottom: 50,
    left: 40
};

const svg = d3.select("#tree")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

const g = svg.append("g")
    .attr(
        "transform",
        `translate(${margin.left},${margin.top})`
    );


// ------------------------------------------------------------
// Tree layout
// ------------------------------------------------------------

const tree = d3.tree()
    .nodeSize([70, 240]);

const root = d3.hierarchy(data);

let nodeId = 0;

root.each(d => {
    d.id = ++nodeId;
});

update(root);


// ------------------------------------------------------------
// Update tree
// ------------------------------------------------------------

function update(source) {

    tree(root);

    const nodes = root.descendants();
    const links = root.links();

    // Center vertically
    const minY = d3.min(nodes, d => d.x);
    const maxY = d3.max(nodes, d => d.x);

    const treeHeight = maxY - minY;

    const offsetY =
        (height - treeHeight) / 2 - minY;

    g.attr(
        "transform",
        `translate(${margin.left},${offsetY})`
    );


    // --------------------------------------------------------
    // Links
    // --------------------------------------------------------

    const link = g.selectAll(".link")
        .data(links, d => d.target.id);

    link.join(
        enter => enter
            .append("path")
            .attr("class", "link")
            .attr("d", d => elbow(d)),
        update => update
            .attr("d", d => elbow(d)),
        exit => exit.remove()
    );


    // --------------------------------------------------------
    // Nodes
    // --------------------------------------------------------

    const node = g.selectAll(".node")
        .data(nodes, d => d.id);

    const nodeEnter = node.enter()
        .append("g")
        .attr("class", d => `node ${d.data.type}`)
        .attr(
            "transform",
            d => `translate(${d.y},${d.x})`
        )
        .style("cursor", d =>
            d.children || d._children
                ? "pointer"
                : "default"
        )
        .on("click", function(event, d) {

            if (!d.children && !d._children)
                return;

            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }

            update(d);
        });


    // --------------------------------------------------------
    // Node rectangles
    // --------------------------------------------------------

    nodeEnter
        .append("rect")
        .attr("x", d => -nodeWidth(d) / 2)
        .attr("y", -23)
        .attr("width", d => nodeWidth(d))
        .attr("height", 46);


    // --------------------------------------------------------
    // Node labels
    // --------------------------------------------------------

    nodeEnter
        .append("text")
        .attr("class", "title")
        .attr("text-anchor", "middle")
        .attr("dy", "5px")
        .text(d => d.data.name);


    // --------------------------------------------------------
    // Expand/collapse indicator
    // --------------------------------------------------------

    nodeEnter
        .filter(d => d.children || d._children)
        .append("circle")
        .attr("cx", d => nodeWidth(d) / 2 - 12)
        .attr("cy", -15)
        .attr("r", 6)
        .attr("fill", "#64748b")
        .attr("stroke", "white")
        .attr("stroke-width", 1);

    nodeEnter
        .filter(d => d.children || d._children)
        .append("text")
        .attr("x", d => nodeWidth(d) / 2 - 12)
        .attr("y", -11)
        .attr("text-anchor", "middle")
        .attr("font-size", "10px")
        .attr("fill", "white")
        .text(d => d.children ? "−" : "+");


    nodeEnter.merge(node)
        .attr(
            "transform",
            d => `translate(${d.y},${d.x})`
        );

    node.exit().remove();
}


// ------------------------------------------------------------
// Draw elbow connectors
// ------------------------------------------------------------

function elbow(d) {

    const sourceX = d.source.y;
    const sourceY = d.source.x;

    const targetX = d.target.y;
    const targetY = d.target.x;

    const middleX =
        (sourceX + targetX) / 2;

    return `
        M ${sourceX},${sourceY}
        H ${middleX}
        V ${targetY}
        H ${targetX}
    `;
}


// ------------------------------------------------------------
// Dynamic node width
// ------------------------------------------------------------

function nodeWidth(d) {

    const text =
        d.data.name || "";

    return Math.max(
        150,
        Math.min(
            360,
            text.length * 7.2 + 40
        )
    );
}


// ------------------------------------------------------------
// Responsive resize
// ------------------------------------------------------------

window.addEventListener("resize", () => {

    const newWidth =
        container.clientWidth;

    svg.attr("width", newWidth);

    update(root);
});

</script>

</body>
</html>
